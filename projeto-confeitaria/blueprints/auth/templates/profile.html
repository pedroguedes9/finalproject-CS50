{% extends "layout.html" %}
{% block title%}Perfil{%endblock%}
{% block main %}
    <div class="mt-5">
        <h1 class="text-center font-bold font-serif text-3xl">Perfil</h1>
        <form action="{{url_for('auth.profile')}}" method="post">
            <div class="flex flex-col items-center ">
                <div class=" w-full max-w-md px-4 ">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-6">
                        <label for="new-username" class="block mb-2.5 text-sm font-medium font-serif text-[#373831]"><span class="font-semibold">Nome</label>
                        <input
                        type="text"
                        id="new-username"
                        name="username"
                        inputmode="text"
                        autocomplete="username"
                        value="{{user.username}}"
                        class="bg-[#eae9dd] text-pink-900 text-sm rounded-lg focus:ring-2
                        focus:ring-[#f7c5c5] block w-full px-3 py-2.5 shadow-sm placeholder:text-gray-600/60"
                        placeholder="Seu novo nome"
                        required />
                    </div>
                    <div class="mb-6">
                        <label for="phone" class="block mb-2.5 text-sm font-medium font-serif text-[#373831]"><span class="font-semibold">Telefone</label>
                        <input
                        type="tel"
                        id="phone"
                        name="phone"
                        inputmode="tel" 
                        autocomplete="tel-national"
                        value="{{user.phone_number}}"
                        class="bg-[#eae9dd] text-pink-900
                        text-sm rounded-lg focus:ring-2 focus:ring-[#f7c5c5] block w-full px-3 py-2.5 shadow-sm placeholder:text-gray-600/60"
                        placeholder="Novo telefone: (xx) xxxx-xxxx"
                        pattern="\s*(\d{2}|\d{0})[-. ]?(\d{5}|\d{4})[-. ]?(\d{4})[-. ]?\s*"
                        required />
                    </div>
                    <p class="font-serif text-center"><span class="font-semibold text-sm">Email:</span> {{user.email}}</p>
                    <div class="flex justify-center">
                    <button
                        type="submit"
                        class="text-white bg-[#815a5b] hover:bg-[#a97c7d] shadow-xl shadow-[#815a5b]/5 transition duration-300 focus:ring-2 focus:ring-[#f7c5c5]
                        font-medium leading-5 rounded-full text-sm px-8 py-3 focus:outline-none mt-6 ">
                        Salvar alterações
                    </button>
                </div>
                </div>
            </div>
        </form>
        <form id="delete-form-{{current_user.id}}" action="{{url_for('auth.logout')}}" method="get">
            <div class="flex justify-center">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" value="{{current_user.id}}" name="id">
                <button
                    type="button"
                    data-modal-target="popup-modal-{{ current_user.id }}"
                    data-modal-toggle="popup-modal-{{ current_user.id }}"
                    class="text-white bg-[#b91c1c] hover:bg-red-800 shadow-xl shadow-red-600/5 transition duration-300 focus:ring-2 focus:ring-[#f7c5c5]
                    font-medium leading-5 rounded-full text-sm px-8 py-3 focus:outline-none mt-6 ">
                    Sair
                </button>
            </div>
        </form>
    </div>
    <div
        id="popup-modal-{{ current_user.id }}"
        tabindex="-1"
        aria-hidden="true"
        class="hidden fixed inset-0 z-50 items-center justify-center bg-black/30 backdrop-blur-[2px]"
        >
        <div class="relative w-full max-w-md p-4">
            <div class="relative rounded-2xl border border-[#E6D3D3] bg-[#FFF8F8] p-6 shadow-sm">
                <button
                    type="button"
                    class="absolute right-3 top-3 h-9 w-9 rounded-full text-[#5F4344] hover:bg-[#F4DDDD]"
                    data-modal-hide="popup-modal-{{ current_user.id }}"
                >
                    <span class="sr-only">Fechar</span>
                    ✕
                </button>

                <div class="text-center">
                    <p class="text-sm uppercase tracking-wide text-[#8B6A6B]">Confirmação</p>
                    <h3 class="mt-2 text-lg font-semibold text-[#3F2D2E]">
                        Você quer sair?
                    </h3>

                    <div class="mt-6 flex items-center justify-center gap-3">
                        <button
                        type="submit"
                        form="delete-form-{{ current_user.id }}"
                        class="rounded-full bg-[#b91c1c] px-5 py-2 text-sm font-medium text-white hover:bg-[#7d1410]"
                        >
                            Sim, sair
                        </button>
                        <button
                            type="button"
                            data-modal-hide="popup-modal-{{ current_user.id }}"
                            class="rounded-full border border-[#D4A5A5] bg-[#FDF4F4] px-5 py-2 text-sm font-medium text-[#5F4344] hover:bg-[#F4DDDD]"
                        >
                            Cancelar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
