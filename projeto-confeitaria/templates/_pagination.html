{% if total_pages > 1 %}
    <nav class="mt-8 flex items-center justify-center gap-2">
        {% if page > 1 %}
            <a class="px-3 py-1 rounded border" href="?page={{ page - 1 }}">Anterior</a>
        {% endif %}

        {% for p in range(1, total_pages + 1) %}
            {% if p == page %}
                <span class="px-3 py-1 rounded bg-pink-600 text-white">{{ p }}</span>
            {% else %}
                <a class="px-3 py-1 rounded border" href="?page={{ p }}">{{ p }}</a>
            {% endif %}
        {% endfor %}

        {% if page < total_pages %}
            <a class="px-3 py-1 rounded border" href="?page={{ page + 1 }}">Proxima</a>
        {% endif %}
    </nav>
{% endif %}
