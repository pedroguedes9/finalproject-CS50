<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block title%} {%endblock%}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logos/logo2.png')}}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="{{url_for('static', filename='styles/style.css')}}">
</head>
<body class="bg-[#F8F5F0]">

    <div class="drawer lg:drawer-open">
        <input id="my-drawer-4" type="checkbox" class="drawer-toggle" />
        <div class="drawer-content flex flex-col min-h-dvh bg-[#F8F5F0]">
            <!-- Navbar -->
            <header>
                <nav class="navbar w-full bg-[#D4A5A5]/80 backdrop-blur-md shadow-xl shadow-[#815a5b]/10" >
                    <label for="my-drawer-4" aria-label="open sidebar" class="lg:hidden btn btn-square btn-ghost">
                        <!-- Sidebar toggle icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"></path><path d="M9 4v16"></path><path d="M14 10l2 2l-2 2"></path></svg>
                    </label>
                    <a href="#" class="flex items-center space-x-3 rtl:space-x-reverse">
                        <img src="{{ url_for('static', filename='images/logos/logo2.png')}}" class="ml-6 origin-left h-7 sm:ml-0 scale-200" alt="Logo" />
                        <span class="self-center text-xl font-semibold text-pink-900  whitespace-nowrap">Doce império Admin</span>
                    </a>
                </nav>
            </header>
            {% include "_messages.html" %}
            <main class="bg-[#F8F5F0] flex-1 ">
                {% block main %} {% endblock %}
            </main>
        </div>

        <div class="drawer-side is-drawer-close:overflow-visible">
            <label for="my-drawer-4" aria-label="close sidebar" class="drawer-overlay"></label>
            <aside class="pt-3 flex min-h-full flex-col items-start bg-[#FAF7F2] border-r border-[#E8DED7] transition-all duration-300 is-drawer-close:w-14" style="width: 200px;" >
                <!-- Sidebar content here -->
                <ul class="flex flex-col w-full gap-2  grow">
                    <!-- List item -->
                    <div class="flex flex-col flex-1 gap-1">
                        <li class="w-full">
                            <a href="{{url_for('admin_panel.dashboard.dashboard')}}"
                            class="text-[#4B2E2B] text-[15px] shadow-sm px-3 py-2.5 w-full rounded-md font-medium
                            hover:bg-[#F4DDDD] flex items-center gap-3 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="size-5 shrink-0"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                                <span class="w-full is-drawer-close:hidden">Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <a href="{{url_for('admin_panel.admin_products.products')}}"
                            class="text-[#4B2E2B] text-[15px] shadow-sm px-3 py-2.5 w-full rounded-md font-medium
                            hover:bg-[#F4DDDD] flex items-center gap-3 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 shrink-0">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                                </svg>
                                <span class="is-drawer-close:hidden">Produtos</span>
                            </a>
                        </li>
                        <li>
                            <a href="{{url_for('admin_panel.admin_products.create_product')}}"
                            class="text-[#4B2E2B] text-[15px] shadow-sm px-3 py-2.5 w-full rounded-md font-medium
                            hover:bg-[#F4DDDD] flex items-center gap-3 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="size-5 shrink-0"> 
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" /> <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v8m-4-4h8" /> 
                                </svg>
                                <span class="is-drawer-close:hidden">Criar um produto</span>
                            </a>
                        </li>
                        <li>
                            <a href="{{url_for('admin_panel.categories.categories')}}"
                            class="text-[#4B2E2B] text-[15px] shadow-sm px-3 py-2.5 w-full rounded-md font-medium
                            hover:bg-[#F4DDDD] flex items-center gap-3 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 shrink-0">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
                                </svg>
                                <span class="is-drawer-close:hidden">Categorias</span>
                            </a>
                        </li>
                        <li>
                            <a href="{{url_for('admin_panel.admin_orders.orders')}}"
                            class="text-[#4B2E2B] text-[15px] shadow-sm px-3 py-2.5 w-full rounded-md font-medium
                            hover:bg-[#F4DDDD] flex items-center gap-3 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 shrink-0">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V8.25H8.25Zm-1.5 0h7.5" />
                                </svg>
                                <span class="is-drawer-close:hidden">Pedidos</span>
                            </a>
                        </li>
                    </div>
                    <hr>
                    <div>
                        <li>
                            <a href="{{url_for('index')}}"
                            class="text-[#4B2E2B] text-[15px] shadow-sm px-3 py-2.5 w-full rounded-md font-medium
                            hover:bg-[#F4DDDD] flex items-center gap-3 transition-colors">
                                <span class="is-drawer-close:hidden">Site normal</span>
                            </a>
                        </li>
                    </div>
                </ul>
            </aside>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
<script src="{{url_for('static', filename='js/decimal_validator.js')}}"></script>
</html>
